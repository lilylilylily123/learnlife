name: "Calendar: Test & Lint"

on:
  push:
    branches:
      - main
    paths:
      - "apps/ll-calendar/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      # Every packages/*/tsconfig.json extends it, so editing it changes the
      # semantics of the only check those packages have.
      - "tsconfig.base.json"
      - ".github/workflows/calendar-test.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/ll-calendar/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/calendar-test.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter ll_calendar lint

      # See the note in nfc-test-build.yml: the shared packages ship no tests,
      # so tsc is the only check that covers them, and both workflows trigger
      # on packages/**.
      - name: Typecheck shared packages
        run: pnpm -r --filter "./packages/*" typecheck

      # Guards the committed cross-language fixture against silent
      # re-baselining: it regenerates from the TypeScript spec in memory and
      # fails if the checked-in JSON differs, naming the cases that moved.
      # Lives beside the typecheck for the same reason — packages/* ship no
      # tests, so these two steps are the only direct coverage they get, and
      # both TS workflows trigger on packages/**.
      - name: Check attendance fixture is in sync
        run: pnpm check:attendance-fixture

      - name: Typecheck calendar app
        run: pnpm --filter ll_calendar typecheck

      - name: Test
        run: pnpm --filter ll_calendar test

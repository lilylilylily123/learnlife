; LearnLife NFC Attender — standalone firmware
;
; Three environments:
;   esp32dev     — production target (ESP32-WROOM-32 + PN532 + SSD1306 + piezo;
;                  no DS3231, deliberately — see README.md "Hardware")
;   esp32dev_ota — same firmware, uploaded over WiFi instead of USB
;   native       — host build for the pure-logic unit tests (no MCU needed).
;                  See docs/TESTING.md, especially the allow-list warning below.

[platformio]
default_envs = esp32dev

[env]
test_framework = unity

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
; Custom flash layout: 1536 KB app slots (up from the default 1280 KB) so OTA
; has room, plus a coredump partition. See hardware/partitions.csv for the
; full rationale — including the warning that this can only ever be applied
; over USB, and that it wipes LittleFS (drain the queue first).
board_build.partitions = hardware/partitions.csv
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0
build_unflags = -std=gnu++11
lib_deps =
    adafruit/Adafruit PN532@^1.3.3
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    bblanchon/ArduinoJson@^7.2.0

; Over-the-air upload to a device already in the field.
;
; Same firmware as esp32dev — only the transport differs. Use this instead of
; carrying a laptop and a USB cable to a screwed-shut enclosure.
;
;   pio run -e esp32dev_ota -t upload \
;       --upload-port ll-attender-a1b2.local \
;       --upload-flags --auth=<password>
;
; The hostname is <device_id> from NVS; `ota` on the serial console prints it.
; The password was shown ONCE on the setup confirmation page and is stored only
; as a hash on the device — if it is lost, re-provision (type RESET at boot) to
; generate a new one.
;
; Credentials are deliberately NOT committed here. Pass them on the command
; line, or put them in a git-ignored platformio_override.ini.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota

; Host-side build for the pure-logic unit tests — 13 suites, 177 cases
; (134 hand-written, plus 43 driven by the shared cross-language attendance
; fixture; see docs/TESTING.md).
; No Arduino headers; only files in src/ that compile against the C++ stdlib.
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -I src
    -DLLATTENDER_NATIVE_BUILD
    ; Absolute path to the cross-language state-machine fixture that
    ; test_state_machine shares with the Vitest suite in apps/nfc-attender.
    ; A missing define is a compile error in fixture_runner.cpp, not a silent
    ; zero-case run — see the allow-list warning below for why that matters.
    -DLL_ATTENDANCE_FIXTURE='"$PROJECT_DIR/../../packages/shared/fixtures/attendance-state-machine.json"'
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
; Pure-stdlib modules build on the host; everything else pulls in Arduino.h
; and is excluded. Each entry here corresponds to a test_* directory below.
build_src_filter = -<*> +<state_machine.cpp> +<fields.cpp> +<pb_request.cpp> +<queue_format.cpp> +<pb_response.cpp> +<attendance_adapter.cpp> +<chunked_source.cpp> +<queue_core.cpp> +<roster_format.cpp> +<jwt.cpp>
; Tell pio-test to compile src/ alongside the test files — otherwise the
; tests fail to link the symbols they reference.
test_build_src = yes
; NOTE: build_src_filter above and test_filter below are explicit allow-lists.
; A new pure module that isn't added to BOTH is silently never compiled and
; never run — it won't fail, it just won't exist. Header-only modules (e.g.
; clock_gate.h) need only a test_filter entry, since there is no .cpp to build.
; Helper .cpp files that live INSIDE an already-listed test_* directory (e.g.
; test_state_machine/fixture_runner.cpp) need no entry in either list — the
; whole directory is compiled as one binary.
test_filter = test_state_machine, test_fields, test_pb_request, test_queue_format, test_pb_response, test_attendance_adapter, test_clock_gate, test_json_source, test_chunked_source, test_queue_core, test_pb_result, test_roster_format, test_jwt
